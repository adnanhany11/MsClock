name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create App
        run: cordova create app com.adnan.masjidclock MasjidClock
      - name: Copy HTML File
        run: |
          cp index.html app/www/
          if [ -d "sounds" ]; then cp -r sounds app/www/; fi
      - name: Build APK
        run: |
          cd app
          cordova platform add android
          cordova build android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasjidClock-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
